services:
  postgres:
    image: postgres:16
    container_name: synko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synko}
      POSTGRES_USER: ${POSTGRES_USER:-synko_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synko_password}
    ports:
      - "5432:5432"
    volumes:
      - synko_postgres_data:/var/lib/postgresql/data
    networks:
      - synko_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: synko-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - synko_qdrant_data:/qdrant/storage
    networks:
      - synko_network

volumes:
  synko_postgres_data:
  synko_qdrant_data:

networks:
  synko_network:
    driver: bridge