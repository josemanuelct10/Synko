<div class="login-page">
  <div class="login-card">
    <div class="login-card__toolbar">
      <app-theme-switcher></app-theme-switcher>
      <app-language-switcher></app-language-switcher>
    </div>

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand__icon" aria-hidden="true">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <span class="login-brand__name">Synko</span>
    </div>

    <!-- Heading -->
    <h1 class="login-card__title">{{ 'login.title' | t }}</h1>
    <p class="login-card__subtitle">{{ 'login.subtitle' | t }}</p>

    <!-- Error banner -->
    @if (errorMessage()) {
      <div class="login-error" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        {{ errorMessage() }}
      </div>
    }

    <!-- Form -->
    <form class="login-form" (ngSubmit)="submit()" #loginForm="ngForm" novalidate>

      <div class="form-field">
        <label class="form-field__label" for="email">{{ 'login.emailLabel' | t }}</label>
        <input
          class="form-field__input"
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          [placeholder]="'login.emailPlaceholder' | t"
          [(ngModel)]="form.email"
          required
          [disabled]="isSubmitting()"
        />
      </div>

      <div class="form-field">
        <label class="form-field__label" for="password">{{ 'login.passwordLabel' | t }}</label>
        <input
          class="form-field__input"
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
          [placeholder]="'login.passwordPlaceholder' | t"
          [(ngModel)]="form.password"
          required
          [disabled]="isSubmitting()"
        />
      </div>

      <button
        class="btn-primary"
        type="submit"
        [disabled]="isSubmitting()"
      >
        @if (isSubmitting()) {
          <span class="btn-spinner" aria-hidden="true"></span>
          {{ 'login.submitting' | t }}
        } @else {
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          {{ 'login.submit' | t }}
        }
      </button>

    </form>

    <p class="login-card__footer">
      {{ 'login.noAccount' | t }}
      <a routerLink="/register" class="login-card__link">{{ 'login.createOne' | t }}</a>
    </p>

  </div>
</div>
