<div class="register-page">
	<div class="register-card">
		<div class="register-brand">
			<div class="register-brand__icon" aria-hidden="true">
				<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
					<rect width="28" height="28" rx="6" fill="var(--color-primary)" />
					<path d="M7 14h5m4 0h5M14 7v5m0 4v5" stroke="#fff" stroke-width="2" stroke-linecap="round" />
				</svg>
			</div>
			<span class="register-brand__name">Synko</span>
		</div>

		<h1 class="register-card__title">Create your account</h1>
		<p class="register-card__subtitle">Set up your access to the Synko workspace with your professional email.</p>

		@if (errorMessage()) {
			<div class="register-banner register-banner--error" role="alert">
				<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<circle cx="8" cy="8" r="7" stroke="var(--color-error)" stroke-width="1.5" />
					<path d="M8 5v4M8 11v.5" stroke="var(--color-error)" stroke-width="1.5" stroke-linecap="round" />
				</svg>
				{{ errorMessage() }}
			</div>
		}

		@if (successMessage()) {
			<div class="register-banner register-banner--success" role="status">
				<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
					<circle cx="8" cy="8" r="7" stroke="var(--color-success)" stroke-width="1.5" />
					<path d="M5 8.5 7 10.5 11 6.5" stroke="var(--color-success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
				</svg>
				{{ successMessage() }}
			</div>
		}

		<form class="register-form" (ngSubmit)="submit()" #registerForm="ngForm" novalidate>
			<div class="form-field">
				<label class="form-field__label" for="name">Full name</label>
				<input
					class="form-field__input"
					id="name"
					type="text"
					name="name"
					autocomplete="name"
					placeholder="Jane Smith"
					[(ngModel)]="form.name"
					required
					[disabled]="isSubmitting()"
				/>
			</div>

			<div class="form-field">
				<label class="form-field__label" for="email">Email address</label>
				<input
					class="form-field__input"
					id="email"
					type="email"
					name="email"
					autocomplete="email"
					placeholder="you@company.com"
					[(ngModel)]="form.email"
					required
					[disabled]="isSubmitting()"
				/>
			</div>

			<div class="form-field">
				<label class="form-field__label" for="password">Password</label>
				<input
					class="form-field__input"
					id="password"
					type="password"
					name="password"
					autocomplete="new-password"
					placeholder="Create a secure password"
					[(ngModel)]="form.password"
					required
					[disabled]="isSubmitting()"
				/>
			</div>

			<button class="btn-primary" type="submit" [disabled]="isSubmitting()">
				@if (isSubmitting()) {
					<span class="btn-spinner" aria-hidden="true"></span>
					Creating account…
				} @else {
					Create account
				}
			</button>
		</form>

		<p class="register-card__footer">
			Already have access?
			<a routerLink="/login" class="register-card__link">Sign in</a>
		</p>
	</div>
</div>
