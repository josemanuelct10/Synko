<div class="register-page">
	<div class="register-card">
		<div class="register-card__toolbar">
			<app-theme-switcher></app-theme-switcher>
			<app-language-switcher></app-language-switcher>
		</div>
		<div class="register-brand">
			<div class="register-brand__icon" aria-hidden="true">
				<i class="fa-solid fa-user-shield"></i>
			</div>
			<span class="register-brand__name">Synko</span>
		</div>

		<h1 class="register-card__title">{{ 'register.title' | t }}</h1>
		<p class="register-card__subtitle">{{ 'register.subtitle' | t }}</p>

		@if (errorMessage()) {
			<div class="register-banner register-banner--error" role="alert">
				<i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
				{{ errorMessage() }}
			</div>
		}

		@if (successMessage()) {
			<div class="register-banner register-banner--success" role="status">
				<i class="fa-solid fa-circle-check" aria-hidden="true"></i>
				{{ successMessage() }}
			</div>
		}

		<form class="register-form" (ngSubmit)="submit()" #registerForm="ngForm" novalidate>
			<div class="form-field">
				<label class="form-field__label" for="name">{{ 'register.nameLabel' | t }}</label>
				<input
					class="form-field__input"
					id="name"
					type="text"
					name="name"
					autocomplete="name"
					[placeholder]="'register.namePlaceholder' | t"
					[(ngModel)]="form.name"
					required
					[disabled]="isSubmitting()"
				/>
			</div>

			<div class="form-field">
				<label class="form-field__label" for="email">{{ 'register.emailLabel' | t }}</label>
				<input
					class="form-field__input"
					id="email"
					type="email"
					name="email"
					autocomplete="email"
					[placeholder]="'register.emailPlaceholder' | t"
					[(ngModel)]="form.email"
					required
					[disabled]="isSubmitting()"
				/>
			</div>

			<div class="form-field">
				<label class="form-field__label" for="password">{{ 'register.passwordLabel' | t }}</label>
				<input
					class="form-field__input"
					id="password"
					type="password"
					name="password"
					autocomplete="new-password"
					[placeholder]="'register.passwordPlaceholder' | t"
					[(ngModel)]="form.password"
					required
					[disabled]="isSubmitting()"
				/>
			</div>

			<button class="btn-primary" type="submit" [disabled]="isSubmitting()">
				@if (isSubmitting()) {
					<span class="btn-spinner" aria-hidden="true"></span>
					{{ 'register.submitting' | t }}
				} @else {
					<i class="fa-solid fa-user-plus" aria-hidden="true"></i>
					{{ 'register.submit' | t }}
				}
			</button>
		</form>

		<p class="register-card__footer">
			{{ 'register.alreadyHaveAccess' | t }}
			<a routerLink="/login" class="register-card__link">{{ 'register.signIn' | t }}</a>
		</p>
	</div>
</div>
